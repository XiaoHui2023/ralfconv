name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-ubuntu16:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack in Ubuntu 16.04
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ubuntu:16.04 \
            bash tools/ci_pack_ubuntu16.sh

      - name: Fix dist permissions
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist/ralfconv
            dist/ralfconv-*.tar.gz
          if-no-files-found: error

  publish-release:
    needs: build-linux-ubuntu16
    if: always() && needs.build-linux-ubuntu16.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          version=$(grep -E '^version\s*=' pyproject.toml | head -1 | sed -E 's/.*=\s*"([^"]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "version not found in pyproject.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-assets

      - name: Point release tag at this commit
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.ver.outputs.tag }}';
            const sha = context.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              await github.rest.git.updateRef({
                owner,
                repo,
                ref: `tags/${tag}`,
                sha,
                force: true,
              });
            } catch (error) {
              if (error.status === 422) {
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `tags/${tag}`,
                  sha,
                });
              } else {
                throw error;
              }
            }

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Release ${{ steps.ver.outputs.tag }}
          body: |
            滚动发版：产物来自触发本 workflow 的 main 提交。
            版本号见 pyproject.toml 与附件文件名。
          generate_release_notes: false
          files: release-assets/**
          fail_on_unmatched_files: true
