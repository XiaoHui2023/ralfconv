name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-ubuntu16:
    name: Build Linux on Ubuntu 16.04
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack in Ubuntu 16.04
        run: docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work ubuntu:16.04 bash tools/ci_pack_ubuntu16.sh

      - name: Fix dist permissions
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - name: Show release assets
        run: ls -lah dist

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist/ralfconv
            dist/ralfconv-*-linux.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-linux-ubuntu16
    if: always() && needs.build-linux-ubuntu16.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          version=$(grep -E '^version\s*=' pyproject.toml | head -1 | sed -E 's/.*=\s*"([^"]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "version not found in pyproject.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Download Linux release assets
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-assets

      - name: Point release tag at this commit
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.ver.outputs.tag }}';
            const sha = context.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              await github.rest.git.updateRef({
                owner,
                repo,
                ref: `tags/${tag}`,
                sha,
                force: true,
              });
            } catch (error) {
              if (error.status === 404 || error.status === 422) {
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/tags/${tag}`,
                  sha,
                });
              } else {
                throw error;
              }
            }

      - name: Remove legacy release assets
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.ver.outputs.tag }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              }));
            } catch (error) {
              if (error.status === 404) {
                return;
              }
              throw error;
            }
            const legacy = /^ralf-conv/;
            for (const asset of release.assets) {
              if (legacy.test(asset.name)) {
                core.info(`Deleting legacy asset: ${asset.name}`);
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: asset.id,
                });
              }
            }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Release ${{ steps.ver.outputs.tag }}
          body: |
            Rolling release: assets are built from the main commit that triggered this workflow.
            Version comes from pyproject.toml and the release asset names.
          files: release-assets/**
          fail_on_unmatched_files: true
          generate_release_notes: false
